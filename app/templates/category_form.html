{% extends "base.html" %}
{% block title %}Nowa kategoria{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <p class="kicker">Kolejki modelu</p>
    <h1>Nowa kategoria</h1>
  </div>
  <a class="button ghost" href="/kategorie">Anuluj</a>
</header>

{% if form_error %}<p class="flash error" role="alert">{{ form_error }}</p>{% endif %}

<form method="post" action="/kategorie" class="card form-card">
  <div class="form-grid">
    <label class="span-2">
      <span>Nazwa</span>
      <input name="name" required maxlength="80" value="{{ form.name }}">
    </label>
    <label class="span-2">
      <span>Kod</span>
      <input name="code" maxlength="48" value="{{ form.code }}" autocapitalize="none" spellcheck="false">
      <small>Zostaw puste, a kod powstanie z nazwy. Model zwraca właśnie ten kod.</small>
    </label>
    <label class="span-2">
      <span>Opis dla modelu</span>
      <textarea name="description" required rows="5">{{ form.description }}</textarea>
      <small>Co do tej kolejki należy i czego tu nie wrzucać.</small>
    </label>
  </div>
  <div class="form-actions">
    <button class="button" type="submit">Dodaj</button>
  </div>
</form>
{% endblock %}
